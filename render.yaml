# Deploy to Render (https://render.com). Push the repo, then in the Render
# dashboard choose "New > Blueprint" and point it at this file.
#
# Note: Swish fetches from basketball-reference.com on demand. From a datacenter
# IP the first lookup of an uncached player can be slow or rate-limited, and the
# free plan's disk is wiped on redeploy, so the SQLite cache does not persist
# between deploys. It works, but a warm local run is smoother.
services:
  - type: web
    name: swish
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: python -m uvicorn swish.api:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SWISH_HOME
        value: /tmp/swish
