# Deploy to Render (https://render.com). Push the repo, then in the Render
# dashboard choose "New > Blueprint" and point it at this file.
#
# The committed season snapshot (swish/data/season.json) means the common
# lookups need no network, so a cold deploy is fast. A player outside the
# snapshot is still fetched from basketball-reference.com on demand, which from a
# datacenter IP can be slow or rate-limited; the free plan also wipes the disk
# on redeploy, so that live cache does not persist between deploys.
services:
  - type: web
    name: swish
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: python -m uvicorn swish.api:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SWISH_HOME
        value: /tmp/swish
