<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swish</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%80%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" data-nav="#/" title="Swish — NBA trade value">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="var(--accent)" />
          <g fill="none" stroke="rgba(18,10,2,0.42)" stroke-width="1.7" stroke-linecap="round">
            <path d="M16 1.4v29.2" />
            <path d="M1.4 16h29.2" />
            <path d="M5.7 5.1c5.4 6 5.4 15.8 0 21.8" />
            <path d="M26.3 5.1c-5.4 6-5.4 15.8 0 21.8" />
          </g>
        </svg>
        <span class="brand-word">
          <span class="brand-name">Swish</span>
          <span class="brand-tag">NBA trade value</span>
        </span>
      </div>

      <form class="search" id="search" autocomplete="off">
        <input id="search-input" type="search" placeholder="Search any NBA player — “Luka Doncic”, “jokic”…" />
      </form>

      <nav class="tabs" id="tabs">
        <a href="#/compare" data-tab="compare">Compare</a>
        <a href="#/trade" data-tab="trade">Trade</a>
        <a href="#/leaderboard" data-tab="leaderboard">Leaderboard</a>
        <a href="#/method" data-tab="method">Method</a>
      </nav>

      <button id="theme-toggle" class="icon-btn" title="Theme">◐</button>
    </header>

    <main id="view" class="view"></main>

    <footer class="foot">
      <span id="version"></span>
      <span>Data: basketball-reference.com · fetched live, cached locally</span>
    </footer>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
